[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcat"
version = "0.1.0"
description = "Vulnerability-guided Cascaded Attention Transformer for cancer drug response prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "VCAT Contributors" }
]
dependencies = [
  "h5py>=3.10",
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
  "rdkit>=2023.9.1",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "torch>=2.1",
  "tqdm>=4.66"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vcat*"]
